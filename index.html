<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#020309">
  <title>MYS Studio — технический перерыв</title>
  <style>
    :root{color-scheme:dark;background:#020309}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:#020309}
    body{
      min-height:100vh;min-height:100dvh;
      display:grid;place-items:center;overflow:hidden;
      padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right))
              max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
      color:#f5f7ff;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    body::before,body::after{
      content:"";position:fixed;width:42vmax;height:42vmax;border-radius:50%;
      filter:blur(90px);opacity:.16;pointer-events:none
    }
    body::before{left:-18vmax;top:-18vmax;background:#00e5ff}
    body::after{right:-18vmax;bottom:-18vmax;background:#8b5cf6}
    main{position:relative;width:min(620px,100%);text-align:center}
    .logo{display:block;width:min(320px,74vw);height:auto;margin:0 auto 38px;filter:drop-shadow(0 0 28px rgba(0,229,255,.2))}
    .status{
      display:inline-flex;align-items:center;gap:10px;margin-bottom:22px;
      color:#8eeeff;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase
    }
    .dot{width:8px;height:8px;border-radius:50%;background:#00e5ff;box-shadow:0 0 16px #00e5ff;animation:pulse 1.8s ease-in-out infinite}
    h1{margin:0;font-size:clamp(36px,9vw,72px);line-height:.98;letter-spacing:-.045em}
    p{max-width:470px;margin:24px auto 0;color:#a8afc3;font-size:clamp(16px,4.2vw,19px);line-height:1.55}
    .line{width:min(360px,70vw);height:1px;margin:38px auto 0;background:linear-gradient(90deg,transparent,#00e5ff 35%,#8b5cf6 65%,transparent)}
    small{display:block;margin-top:18px;color:#687086;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
    @keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
    @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="mys-logo-hq.webp" alt="MYS Studio">
    <div class="status"><span class="dot"></span>Технический перерыв</div>
    <h1>Скоро вернёмся</h1>
    <p>Сейчас мы обновляем сайт. Он снова станет доступен после завершения технических работ.</p>
    <div class="line"></div>
    <small>Mixing your sound</small>
  </main>
</body>
</html>
